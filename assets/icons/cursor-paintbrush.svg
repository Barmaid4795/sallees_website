    <line x1="18.6" y1="2.5" x2="18.6" y2="15.5" stroke="#5b3a1a" stroke-width="0.6" opacity="0.5"/>
    <line x1="21.2" y1="2.5" x2="21.2" y2="15.5" stroke="#dba25f" stroke-width="0.6" opacity="0.6"/>

    <!-- ferrule (metal band) -->
