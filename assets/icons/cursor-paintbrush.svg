    <line x1="20" y1="23.6" x2="20" y2="37" stroke="#c9c2b8" stroke-width="0.6"/>
    <line x1="22.4" y1="24" x2="20.8" y2="35.4" stroke="#c9c2b8" stroke-width="0.6"/>

    <!-- paint-loaded tip, small and pointed, not a blob -->
    <path d="M18.7 32.5 C19.1 34.4 19.5 36.3 20 38 C20.5 36.3 20.9 34.4 21.3 32.5 C20.9 33.7 19.1 33.7 18.7 32.5 Z" fill="#1D6FE0"/>
