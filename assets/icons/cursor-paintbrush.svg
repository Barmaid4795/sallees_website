    <line x1="15.3" y1="18.3" x2="24.7" y2="18.3" stroke="#9a9a9a" stroke-width="0.6"/>
    <line x1="15.3" y1="20.7" x2="24.7" y2="20.7" stroke="#9a9a9a" stroke-width="0.6"/>

    <!-- bristle cluster, tapering to a fine point -->
    <path d="M15.6 23 C15.1 26.5 16 30.5 17.2 33.5 C17.9 35.2 18.8 36.6 20 38 C21.2 36.6 22.1 35.2 22.8 33.5 C24 30.5 24.9 26.5 24.4 23 Z"
